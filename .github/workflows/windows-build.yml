name: Windows x64 build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p filmcraft
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-windows-x64
          path: target/release/filmcraft.exe
